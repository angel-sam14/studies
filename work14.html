<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto">

        <h1 class="text-3xl font-bold text-center mb-8">
            Responsive 3 × 3 Grid
        </h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-blue-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">1</div>

            <div class="bg-green-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">2</div>

            <div class="bg-red-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">3</div>

            <div class="bg-yellow-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">4</div>

            <div class="bg-purple-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">5</div>

            <div class="bg-pink-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">6</div>

            <div class="bg-indigo-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">7</div>

            <div class="bg-orange-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">8</div>

            <div class="bg-teal-500 text-white h-40 rounded-lg flex items-center justify-center text-2xl font-bold">9</div>

        </div>

    </div>

</body>
</html>
