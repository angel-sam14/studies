<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Responsive Navbar</title>
</head>

<body class="bg-gray-100">

<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-6">

        <div class="flex items-center justify-between h-16">

            <!-- Logo -->
            <a href="#" class="text-2xl font-bold text-blue-600">
                MyLogo
            </a>

            <!-- Hidden Checkbox -->
            <input type="checkbox" id="menu" class="peer hidden">

            <!-- Hamburger -->
            <label for="menu" class="md:hidden cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-8 h-8 text-gray-700"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </label>

             <!-- Desktop Menu -->
<div class="hidden md:flex items-center gap-8">
    <a href="#" class="hover:text-blue-600">Home</a>
    <a href="#" class="hover:text-blue-600">About</a>
    <a href="#" class="hover:text-blue-600">Services</a>
    <a href="#" class="hover:text-blue-600">Portfolio</a>
    <a href="#" class="hover:text-blue-600">Contact</a>

    <button class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
        Login
    </button>
</div>

</div>
</div>
</nav>
</body>
</html>
