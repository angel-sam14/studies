<!DOCTYPE html>
<html lang="en">
<head>

    <title>Responsive Text</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <div class="bg-red-500 h-40 sm:bg-yellow-500 md:bg-green-500 lg:bg-blue-500 xl:bg-violet-500 flex items-center justify-center">

    </div>
